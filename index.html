<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aunt B's Cleaning Services | Making Homes Shine</title>
    <meta
      name="description"
      content="Friendly, detail-focused residential cleaning in your area. Standard, deep, move-in/out, and recurring cleaning. Request a free quote today."
    />
    <meta name="theme-color" content="#E23F84" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Caveat:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-cream text-ink font-body antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!--
      Netlify Forms detection (inert unless deployed on Netlify).
      Netlify scans the *built* static HTML for forms marked data-netlify
      to register them — it can't see forms rendered later by React. This
      hidden replica mirrors the real quote form's field names so Netlify
      Forms is ready to go the moment this site is deployed there. The
      actual form a visitor fills out lives in src/components/QuoteForm.jsx;
      this one is never shown or used directly.
      See src/lib/submitQuote.js ("OPTION A") for how to wire up the
      matching fetch() call once you're ready to go live on Netlify.
    -->
    <form name="quote-request" method="POST" data-netlify="true" netlify-honeypot="botField" hidden>
      <input type="text" name="name" />
      <input type="tel" name="phone" />
      <input type="email" name="email" />
      <input type="text" name="city" />
      <input type="text" name="homeSize" />
      <input type="text" name="serviceType" />
      <input type="text" name="bedrooms" />
      <input type="text" name="bathrooms" />
      <input type="text" name="pets" />
      <input type="date" name="preferredDate" />
      <textarea name="notes"></textarea>
      <input type="text" name="selfReportedSource" />
      <input type="text" name="leadSource" />
      <input type="text" name="sourceDetail" />
      <input type="text" name="leadStatus" />
      <input type="text" name="leadCost" />
      <input type="text" name="submittedAt" />
      <input type="text" name="botField" />
    </form>
  </body>
</html>
